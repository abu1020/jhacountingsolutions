    <style>
      #jha-splash{position:fixed;inset:0;z-index:100000;background:#0B1F3A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:transform .7s cubic-bezier(.77,0,.18,1),opacity .7s}

      #jha-splash .ring{stroke:#10B981;stroke-width:3;fill:none;stroke-linecap:round;stroke-dasharray:326;stroke-dashoffset:326;animation:jha-draw 1.1s ease forwards}
      #jha-splash .mono{fill:#fff;font:800 34px 'Plus Jakarta Sans',system-ui,sans-serif;opacity:0;animation:jha-fade .5s .6s ease forwards}
      #jha-splash .name{color:#fff;font:600 17px 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:.02em;opacity:0;animation:jha-fade .5s .8s ease forwards}
      #jha-splash .track{width:180px;height:3px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
      #jha-splash .fill{height:100%;width:0;background:#10B981;animation:jha-bar 1.5s ease-out forwards}
      @keyframes jha-draw{to{stroke-dashoffset:0}}
      @keyframes jha-fade{to{opacity:1}}
      @keyframes jha-bar{to{width:100%}}
      @media (prefers-reduced-motion:reduce){
        #jha-splash,#jha-splash *{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
      }
      #client-login-btn{position:fixed;top:16px;right:16px;z-index:9999;background:#0B1F3A;color:#fff;padding:10px 18px;border-radius:10px;font:600 14px 'Inter',system-ui,sans-serif;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.22);transition:background .2s}
      #client-login-btn:hover{background:#10B981}

      @media (max-width:640px){#client-login-btn{top:10px;right:10px;padding:8px 14px;font-size:13px}}

    <!-- Opening animation (shows once per visit, never longer than 3 seconds) -->

      <svg width="104" height="104" viewBox="0 0 120 120" aria-hidden="true">

    </div>
    <script>
      (function () {
        var s = document.getElementById('jha-splash');
        if (!s) return;
        var seen = false;
        try { seen = sessionStorage.getItem('jha_splash') === '1'; } catch (e) {}
        if (seen) { s.remove(); return; }
        document.documentElement.style.overflow = 'hidden';
        var start = Date.now(), done = false;
        function hide() {
          if (done) return; done = true;
          var wait = Math.max(0, 1500 - (Date.now() - start));
          setTimeout(function () {
            s.classList.add('hide');
            document.documentElement.style.overflow = '';
            try { sessionStorage.setItem('jha_splash', '1'); } catch (e) {}
            setTimeout(function () { s.remove(); }, 800);
          }, wait);
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
        setTimeout(hide, 3000);
      })();
    </script>
